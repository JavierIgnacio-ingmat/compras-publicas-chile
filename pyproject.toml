[project]
name = "compras-publicas-chile"
version = "0.1.0"
description = "Dispersión de precios en compras públicas de Chile con datos abiertos de ChileCompra."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "compras"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
